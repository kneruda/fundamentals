[project]
name = "fundamentals-dashboard"
version = "0.1.0"
description = "Personal equity fundamentals dashboard powered by EODHD data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Storage
    "duckdb>=1.1.0",
    # Data wrangling
    "pandas>=2.2.0",
    "polars>=1.0.0",
    # HTTP and config
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    # UI
    "streamlit>=1.40.0",
    # Charting (Streamlit re-exports plotly via st.plotly_chart)
    "plotly>=5.20.0",
    "matplotlib>=3.10.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "vcrpy>=6.0",        # record/replay HTTP for vendor-client tests
    "ruff>=0.6.0",
    "black>=24.0",
    "mypy>=1.10",        # optional but recommended
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tell hatchling where the package lives.
[tool.hatch.build.targets.wheel]
packages = ["src"]

# --- Tooling configuration ---------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-too-long; ruff format handles this
    "N999",  # Streamlit entry-point Home.py uses PascalCase by convention
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
